<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Lobby — Name taken</title>
<script src="./support.js"></script>
<link rel="stylesheet" href="./luna-design-system.css">
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Gluten:wght@500..900&amp;family=Gaegu:wght@400;700&amp;family=Sniglet:wght@400;800&amp;family=Rubik+Wet+Paint&amp;display=swap" rel="stylesheet">
<style>body{margin:0}</style>
</helmet>
<div class="phone ph-night">
  <div style="display: flex; align-items: center; gap: 8px; padding: 14px 12px 0">
    <a href="Join.dc.html" class="btn btn-icon btn-ghost" aria-label="Back"><span class="i i-arrow-left"></span></a>
    <span class="t-cap t-muted">Step 1 of 2</span>
  </div>
  <div style="padding: 12px 22px 0; display: flex; flex-direction: column; gap: 22px">
    <div>
      <h1 class="h1" style="font-size: 38px">Join the village</h1>
      <p class="t-body t-muted" style="margin: 8px 0 0">Los Primos · Viernes · LUNA42</p>
    </div>
    <div class="field">
      <label class="label" for="nm">Your name</label>
      <input id="nm" class="input is-err" value="Ana" aria-invalid="true" aria-describedby="nm-err">
      <span id="nm-err" class="err"><span class="i i-sm i-info"></span>There’s already an Ana in this village.</span>
    </div>
    <div style="display: flex; flex-direction: column; gap: 10px">
      <span class="label">Try one of these</span>
      <div style="display: flex; flex-wrap: wrap; gap: 8px">
        <button class="chip">Ana B.</button>
        <button class="chip">Anita</button>
        <button class="chip">Ana la Brava</button>
        <button class="chip">Ana 2</button>
      </div>
    </div>
    <div class="card" style="display: flex; gap: 14px; align-items: center">
      <span class="av av-md" style="margin: 0"><span class="face f-ana" role="img" aria-label="The other Ana"></span></span>
      <div class="t-small"><b>Ana</b> joined 2 min ago.<br><span class="t-muted">Names must be unique so votes and chat stay clear.</span></div>
    </div>
  </div>
  <div style="margin-top: auto; position: relative; height: 220px">
    <span class="scene-bg bg-night" style="opacity: .55"></span>
    <div style="position: absolute; left: 22px; right: 22px; bottom: 22px">
      <button class="btn btn-primary btn-lg btn-block" disabled>Pick your look<span class="i i-arrow-right"></span></button>
    </div>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() { return {}; }
}
</script>
</body>
</html>
