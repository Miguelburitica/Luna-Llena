<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Join with code</title>
<script src="./support.js"></script>
<link rel="stylesheet" href="./luna-design-system.css">
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Gluten:wght@500..900&amp;family=Gaegu:wght@400;700&amp;family=Sniglet:wght@400;800&amp;family=Rubik+Wet+Paint&amp;display=swap" rel="stylesheet">
<style>body{margin:0}</style>
</helmet>
<div class="phone ph-night">
  <div style="display: flex; align-items: center; gap: 8px; padding: 14px 12px 0">
    <a href="Home.dc.html" class="btn btn-icon btn-ghost" aria-label="Back"><span class="i i-arrow-left"></span></a>
    <span class="t-cap t-muted">Step 1 of 2</span>
  </div>
  <div style="padding: 12px 22px 0; display: flex; flex-direction: column; gap: 22px">
    <div>
      <h1 class="h1" style="font-size: 38px">Join the village</h1>
      <p class="t-body t-muted" style="margin: 8px 0 0">Your invite link filled in the code. Just tell us who you are.</p>
    </div>
    <div class="field">
      <span class="label">Room code</span>
      <div class="code" style="justify-content: space-between"><input class="is-filled" value="L" aria-label="Code letter 1"><input class="is-filled" value="U" aria-label="Code letter 2"><input class="is-filled" value="N" aria-label="Code letter 3"><input class="is-filled" value="A" aria-label="Code letter 4"><input class="is-filled" value="4" aria-label="Code letter 5"><input class="is-filled" value="2" aria-label="Code letter 6"></div>
      <span class="sbadge is-ok" style="align-self: flex-start; margin-top: 4px"><span class="i i-sm i-check"></span>Room found</span>
    </div>
    <div class="card" style="display: flex; gap: 14px; align-items: center">
      <span class="art bg-night" role="img" aria-label="" style="width: 64px; height: 64px; border-radius: 16px; background-color: #1C1F4A; background-size: cover; flex: none"></span>
      <div style="flex: 1; min-width: 0">
        <div class="h3">Los Primos · Viernes</div>
        <div class="t-small t-muted" style="display: flex; align-items: center; gap: 6px; margin-top: 2px"><span class="i i-sm i-quill"></span>Narrated by Nico · Classic</div>
        <div style="display: flex; align-items: center; gap: 8px; margin-top: 8px">
          <div style="display: flex; padding-left: 7px"><span class="av av-xs" style="margin: 0 0 0 -7px"><span class="face f-ana"></span></span><span class="av av-xs" style="margin: 0 0 0 -7px"><span class="face f-juan"></span></span><span class="av av-xs" style="margin: 0 0 0 -7px"><span class="face f-marta"></span></span><span class="av av-xs" style="margin: 0 0 0 -7px"><span class="face f-luis"></span></span><span class="av av-xs" style="margin: 0 0 0 -7px"><span class="face f-tato"></span></span></div>
          <span class="t-small t-muted">5 of 10 joined</span>
        </div>
      </div>
    </div>
    <label class="field"><span class="label">Your name</span><input class="input" placeholder="What do your friends call you?" value="Caro"></label>
  </div>
  <div style="margin-top: auto; padding: 20px 22px 22px">
    <a href="LobbyPlayer.dc.html" class="btn btn-primary btn-lg btn-block">Pick your look<span class="i i-arrow-right"></span></a>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() { return {}; }
}
</script>
</body>
</html>
