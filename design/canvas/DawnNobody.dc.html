<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Dawn — Nobody died</title>
<script src="./support.js"></script>
<link rel="stylesheet" href="/_blob/d8c3ee55544924b0595ca6734747303d">
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,500..900;1,9..144,500..900&amp;family=IM+Fell+English:ital@0;1&amp;family=Figtree:wght@400;500;600;700;800&amp;display=swap" rel="stylesheet">
<style>body{margin:0}.crowd .av{width:38px;height:38px;margin:0}</style>
</helmet>
<div class="phone ph-dawn">
  <div class="banner">
    <span class="ph-badge"><span class="i i-sunrise"></span></span>
    <div style="flex: 1"><div class="ph-name">Dawn</div><div class="ph-sub">Day 1 · Everyone woke up</div></div>
    <button class="btn btn-icon btn-secondary" aria-label="Hold to peek at your role"><span class="i i-card"></span></button>
  </div>
  <div style="position: relative; height: 360px; flex: none">
    <span class="scene-bg bg-dawn a-rise"></span>
    <span class="art f-rooster a-sway" role="img" aria-label="A proud rooster crowing" style="position: absolute; left: 95px; top: 20px; width: 200px; height: 200px; z-index: 3"></span>
    <div class="crowd" style="position: absolute; left: 0; right: 0; bottom: 18px; display: flex; justify-content: center; gap: 7px; z-index: 3">
      <span class="av av-md a-bob"><span class="face f-ana" role="img" aria-label="Ana"></span></span>
      <span class="av av-md a-bob" style="animation-delay: .2s"><span class="face f-juan" role="img" aria-label="Juan"></span></span>
      <span class="av av-md a-bob" style="animation-delay: .4s"><span class="face f-marta" role="img" aria-label="Marta"></span></span>
      <span class="av av-md a-bob" style="animation-delay: .6s"><span class="face f-luis" role="img" aria-label="Luis"></span></span>
      <span class="av av-md a-bob" style="animation-delay: .8s"><span class="face f-sofi" role="img" aria-label="Sofi"></span></span>
      <span class="av av-md a-bob" style="animation-delay: 1s"><span class="face f-pipe" role="img" aria-label="Pipe"></span></span>
      <span class="av av-md is-you a-bob" style="animation-delay: 1.2s"><span class="face f-caro" role="img" aria-label="Caro, you"></span></span>
      <span class="av av-md a-bob" style="animation-delay: 1.4s"><span class="face f-tato" role="img" aria-label="Tato"></span></span>
    </div>
  </div>
  <div style="padding: 18px 24px 0; text-align: center; display: flex; flex-direction: column; gap: 8px; align-items: center">
    <h1 class="h1" style="font-size: 40px">Nobody died tonight!</h1>
    <p class="t-body" style="margin: 0; color: var(--muted)">The village lets out one big sigh of relief. Somebody’s plan didn’t work…</p>
  </div>
  <div class="parch" style="margin: 18px 12px 0; font-size: 17px; padding: 16px 18px">A shadow crept toward Ana’s door, sniffed twice, and left in a huff. Someone was watching over her<span class="caret"></span></div>
  <button class="chatbar"><span class="i i-chat"></span><span style="flex: 1">Village chat is awake</span><span class="count">3</span><span class="i i-chevron-up"></span></button>
</div>
</x-dc>
