<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Hunter revenge</title>
<script src="./support.js"></script>
<link rel="stylesheet" href="./luna-design-system.css">
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Gluten:wght@500..900&amp;family=Gaegu:wght@400;700&amp;family=Sniglet:wght@400;800&amp;family=Rubik+Wet+Paint&amp;display=swap" rel="stylesheet">
<style>body{margin:0}.pick.is-aim{border-color:#FF6B5E;background:rgba(255,107,94,.18)}</style>
</helmet>
<div class="phone ph-vote" style="background: radial-gradient(ellipse at 50% 30%, #6A2A2A 0%, #2A1030 70%)">
  <div class="netbar" style="background: #FF6B5E; color: #2A0A0A; justify-content: center"><span class="i i-sm i-target"></span>Everyone sees: The Hunter takes aim…</div>
  <div style="display: flex; flex-direction: column; align-items: center; gap: 4px; padding: 22px 20px 0; text-align: center">
    <div style="position: relative; width: 180px; height: 170px">
      <span class="art r-hunter" role="img" aria-label="Hunter" style="position: absolute; inset: 0"></span>
      <span class="av av-sm is-dead" style="position: absolute; left: 4px; bottom: 6px; width: 44px; height: 44px"><span class="face" role="img" aria-label="You died"></span></span>
    </div>
    <h1 class="h1" style="font-size: 34px">You were the Hunter.</h1>
    <p class="t-body" style="margin: 0; color: var(--muted)">The wolves got you — but you get one last shot. Choose fast.</p>
  </div>
  <div style="display: flex; justify-content: center; padding: 16px 0 6px">
    <div class="timer is-warn" style="width: 64px; height: 64px"><svg viewBox="0 0 52 52" style="width: 64px; height: 64px" aria-hidden="true"><circle class="tr-track" cx="26" cy="26" r="22"></circle><circle class="tr-prog" cx="26" cy="26" r="22" stroke-dasharray="138.2" stroke-dashoffset="83"></circle></svg><b style="font-size: 16px">0:08</b></div>
  </div>
  <div class="dock" style="box-shadow: inset 0 0 0 2px #FF6B5E, var(--shadow-2)">
    <div style="display: flex; align-items: center; gap: 8px"><span class="i i-target" style="color: #FF6B5E"></span><span class="h3">Take someone down with you</span></div>
    <div class="picker" style="grid-template-columns: repeat(3, minmax(0, 1fr))">
      <button class="pick"><span class="av"><span class="face f-marta" role="img" aria-label=""></span></span>Marta</button>
      <button class="pick"><span class="av"><span class="face f-sofi" role="img" aria-label=""></span></span>Sofi</button>
      <button class="pick"><span class="av"><span class="face f-pipe" role="img" aria-label=""></span></span>Pipe</button>
      <button class="pick"><span class="av"><span class="face f-caro" role="img" aria-label=""></span></span>Caro</button>
      <button class="pick is-aim"><span class="av"><span class="face f-tato" role="img" aria-label=""></span></span>Tato<span class="chk" style="background: #FF6B5E; color: #fff"><span class="i i-sm i-target"></span></span></button>
    </div>
    <button class="btn btn-danger btn-lg btn-block"><span class="i i-target"></span>Take Tato down</button>
    <span class="t-small t-center t-muted">If time runs out, your shot is lost.</span>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() { return {}; }
}
</script>
</body>
</html>
