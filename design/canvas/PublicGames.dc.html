<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Find a game</title>
<script src="./support.js"></script>
<link rel="stylesheet" href="./luna-design-system.css">
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Gluten:wght@500..900&amp;family=Gaegu:wght@400;700&amp;family=Sniglet:wght@400;800&amp;family=Rubik+Wet+Paint&amp;display=swap" rel="stylesheet">
<style>body{margin:0}</style>
</helmet>
<div class="phone ph-night">
  <div style="display: flex; align-items: center; gap: 8px; padding: 14px 12px 0">
    <a href="Home.dc.html" class="btn btn-icon btn-ghost" aria-label="Back"><span class="i i-arrow-left"></span></a>
    <span class="t-cap t-muted">Public games</span>
    
  </div>
  <div style="padding: 12px 22px 0; display: flex; flex-direction: column; gap: 18px; overflow: auto">
    <div>
      <h1 class="h1" style="font-size: 38px">Find a game</h1>
      <p class="t-body t-muted" style="margin: 8px 0 0">Villages looking for more players. Tap one to join.</p>
    </div>
    <div style="display: flex; gap: 8px; flex-wrap: wrap">
      <button type="button" class="chip is-sel" aria-pressed="true"><span class="i i-sm i-check"></span>Waiting to start</button>
      <button type="button" class="chip is-sel" aria-pressed="true"><span class="i i-sm i-check"></span>Free seats</button>
    </div>

    <a href="Join.dc.html" class="card" style="display: flex; gap: 14px; align-items: center; text-decoration: none; color: inherit">
      <span class="art bg-night" role="img" aria-label="" style="width: 64px; height: 64px; border-radius: 16px; background-color: #1C1F4A; background-size: cover; flex: none"></span>
      <div style="flex: 1; min-width: 0">
        <div style="display: flex; align-items: center; gap: 8px">
          <div class="h3" style="flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap">Lobos de medianoche</div>
          <span class="sbadge is-ok">Waiting</span>
        </div>
        <div class="t-small t-muted" style="display: flex; align-items: center; gap: 6px; margin-top: 2px"><span class="i i-sm i-quill"></span>Narrated by Nico</div>
        <div style="display: flex; align-items: center; gap: 10px; margin-top: 8px; flex-wrap: wrap">
          <span class="t-small t-muted" style="display: flex; align-items: center; gap: 4px"><span class="i i-sm i-users"></span>5 of 15</span>
          <span class="t-small t-muted" style="display: flex; align-items: center; gap: 4px"><span class="i i-sm i-zap"></span>2 bots</span>
          <span class="t-small t-muted" style="display: flex; align-items: center; gap: 4px"><span class="i i-sm i-card"></span>8 cards</span>
        </div>
      </div>
      <span class="btn btn-icon btn-ghost btn-sm" role="button" aria-label="Report this room"><span class="i i-sm i-hand"></span></span>
    </a>

    <a href="Join.dc.html" class="card" style="display: flex; gap: 14px; align-items: center; text-decoration: none; color: inherit">
      <span class="art bg-night" role="img" aria-label="" style="width: 64px; height: 64px; border-radius: 16px; background-color: #1C1F4A; background-size: cover; flex: none"></span>
      <div style="flex: 1; min-width: 0">
        <div style="display: flex; align-items: center; gap: 8px">
          <div class="h3" style="flex: 1; min-width: 0">Los Primos · Viernes</div>
          <span class="sbadge is-ok">Waiting</span>
        </div>
        <div class="t-small t-muted" style="display: flex; align-items: center; gap: 6px; margin-top: 2px"><span class="i i-sm i-quill"></span>Narrated by Vale</div>
        <div style="display: flex; align-items: center; gap: 10px; margin-top: 8px">
          <span class="t-small t-muted" style="display: flex; align-items: center; gap: 4px"><span class="i i-sm i-users"></span>3 of 15</span>
          <span class="t-small t-muted" style="display: flex; align-items: center; gap: 4px"><span class="i i-sm i-card"></span>7 cards</span>
        </div>
      </div>
      <span class="btn btn-icon btn-ghost btn-sm" role="button" aria-label="Report this room"><span class="i i-sm i-hand"></span></span>
    </a>

    <div class="card" aria-disabled="true" style="display: flex; gap: 14px; align-items: center; opacity: 0.55">
      <span class="art bg-night" role="img" aria-label="" style="width: 64px; height: 64px; border-radius: 16px; background-color: #1C1F4A; background-size: cover; flex: none"></span>
      <div style="flex: 1; min-width: 0">
        <div style="display: flex; align-items: center; gap: 8px">
          <div class="h3" style="flex: 1; min-width: 0">Aldea del norte</div>
          <span class="sbadge">In progress</span>
        </div>
        <div class="t-small t-muted" style="display: flex; align-items: center; gap: 6px; margin-top: 2px"><span class="i i-sm i-quill"></span>Narrated by Pipe</div>
        <div style="display: flex; align-items: center; gap: 10px; margin-top: 8px">
          <span class="t-small t-muted" style="display: flex; align-items: center; gap: 4px"><span class="i i-sm i-users"></span>9 of 15</span>
          <span class="t-small t-muted" style="display: flex; align-items: center; gap: 4px"><span class="i i-sm i-card"></span>9 cards</span>
        </div>
      </div>
    </div>

  </div>
  <div style="margin-top: auto; padding: 20px 22px 22px">
    <a href="NarratorSetup.dc.html" class="btn btn-secondary btn-lg btn-block"><span class="i i-quill"></span>Host your own</a>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() { return {}; }
}
</script>
</body>
</html>
