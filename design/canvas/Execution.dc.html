<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Execution</title>
<script src="./support.js"></script>
<link rel="stylesheet" href="./luna-design-system.css">
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Gluten:wght@500..900&amp;family=Gaegu:wght@400;700&amp;family=Sniglet:wght@400;800&amp;family=Rubik+Wet+Paint&amp;display=swap" rel="stylesheet">
<style>body{margin:0}</style>
</helmet>
<div class="phone ph-vote" style="background: linear-gradient(180deg,#1A0A14 0%,#4A1A22 60%,#7A2E35 100%)">
  <div class="banner">
    <span class="ph-badge"><span class="i i-pitchfork"></span></span>
    <div style="flex: 1"><div class="ph-name">Execution</div><div class="ph-sub">Day 2 · Goodbye, Luis</div></div>
  </div>
  <div style="position: relative; height: 330px; flex: none">
    <span class="scene-bg bg-dawn" style="filter: saturate(.7) brightness(.6) hue-rotate(-25deg)"></span>
    <span class="a-poof" aria-hidden="true" style="position: absolute; left: 105px; top: 30px; width: 180px; height: 180px; border-radius: 50%; background: radial-gradient(circle, rgba(255,255,255,.95) 0%, rgba(255,255,255,.5) 35%, rgba(255,255,255,0) 70%)"></span>
    <span class="art f-tomb a-drop" role="img" aria-label="Luis’s tombstone" style="position: absolute; left: 125px; top: 60px; width: 140px; height: 140px; z-index: 2"></span>
    <span class="a-sway" aria-hidden="true" style="position: absolute; left: 270px; top: 40px; z-index: 3"><svg viewBox="0 0 20 28" width="22" height="30"><path d="M10 1 C18 6 18 18 10 27 C2 18 2 6 10 1Z" fill="#F4EBC8"></path><path d="M10 3 V26" stroke="#C9B98A" stroke-width="1.2"></path></svg></span>
    <div style="position: absolute; left: 0; right: 0; bottom: 20px; display: flex; justify-content: center; gap: 10px; z-index: 3">
      <span class="av av-md a-bob"><span class="face f-ana" role="img" aria-label="Ana"></span></span>
      <span class="av av-md a-bob" style="animation-delay: .3s"><span class="face f-marta" role="img" aria-label="Marta"></span></span>
      <span class="av av-md a-bob" style="animation-delay: .6s"><span class="face f-sofi" role="img" aria-label="Sofi"></span></span>
      <span class="av av-md a-bob" style="animation-delay: .9s"><span class="face f-pipe" role="img" aria-label="Pipe"></span></span>
      <span class="av av-md is-you a-bob" style="animation-delay: 1.2s"><span class="face f-caro" role="img" aria-label="Caro, you"></span></span>
      <span class="av av-md" style="filter: saturate(.6)"><span class="face f-tato" role="img" aria-label="Tato, nervous"></span></span>
    </div>
  </div>
  <div style="padding: 8px 24px 0; text-align: center; display: flex; flex-direction: column; gap: 6px; align-items: center">
    <h1 class="h1" style="font-size: 36px">Luis was…</h1>
  </div>
  <div style="display: flex; justify-content: center; padding-top: 14px">
    <div class="rcard team-wolf a-flip" style="width: 220px; height: 250px; padding: 12px">
      <span class="rcard-art r-wolf" role="img" aria-label="Werewolf" style="width: 120px; height: 112px"></span>
      <span class="tbadge"><span class="i i-sm i-paw"></span>Wolves</span>
      <span class="rcard-name" style="font-size: 30px">a Werewolf!</span>
    </div>
  </div>
  <div style="margin-top: auto; padding: 0 12px 12px">
    <div class="card" style="display: flex; align-items: center; gap: 12px; padding: 12px 14px; box-shadow: inset 0 0 0 1.5px #7FD3BF"><span class="tbadge team-village"><span class="i i-sm i-home"></span></span><span class="t-small" style="flex: 1"><b>The village got one!</b> But was he the only wolf?</span></div>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() { return {}; }
}
</script>
</body>
</html>
