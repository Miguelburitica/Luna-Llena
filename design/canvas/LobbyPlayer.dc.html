<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Lobby — Player</title>
<script src="./support.js"></script>
<link rel="stylesheet" href="./luna-design-system.css">
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Gluten:wght@500..900&amp;family=Gaegu:wght@400;700&amp;family=Sniglet:wght@400;800&amp;family=Rubik+Wet+Paint&amp;display=swap" rel="stylesheet">
<style>body{margin:0}.lp .prow{padding:6px 10px}</style>
</helmet>
<div class="phone ph-night">
  <div style="padding: 14px 16px 10px; display: flex; align-items: center; gap: 10px">
    <div style="flex: 1; min-width: 0">
      <div class="t-cap t-muted">Lobby · Classic</div>
      <div class="h2" style="font-size: 22px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis">Los Primos · Viernes</div>
    </div>
    <button class="btn btn-sm btn-secondary" style="font: 800 16px var(--font-display); letter-spacing: .12em">LUNA42</button>
    <button class="btn btn-icon btn-primary" aria-label="Copy invite link"><span class="i i-copy"></span></button>
  </div>

  <div class="card" style="margin: 0 12px; padding: 14px">
    <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 10px"><span class="h3">Pick your look</span><span class="t-small t-muted">one per player</span></div>
    <div style="display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); gap: 8px">
      <button class="pick" style="min-height: 64px; padding: 6px" disabled aria-label="Taken by Ana"><span class="av"><span class="face f-ana"></span></span></button>
      <button class="pick" style="min-height: 64px; padding: 6px" disabled aria-label="Taken by Juan"><span class="av"><span class="face f-juan"></span></span></button>
      <button class="pick" style="min-height: 64px; padding: 6px" disabled aria-label="Taken by Marta"><span class="av"><span class="face f-marta"></span></span></button>
      <button class="pick" style="min-height: 64px; padding: 6px" disabled aria-label="Taken by Luis"><span class="av"><span class="face f-luis"></span></span></button>
      <button class="pick" style="min-height: 64px; padding: 6px"><span class="av"><span class="face f-sofi"></span></span></button>
      <button class="pick" style="min-height: 64px; padding: 6px"><span class="av"><span class="face f-pipe"></span></span></button>
      <button class="pick is-sel" style="min-height: 64px; padding: 6px" aria-label="Your pick"><span class="av"><span class="face f-caro"></span></span><span class="chk"><span class="i i-sm i-check"></span></span></button>
      <button class="pick" style="min-height: 64px; padding: 6px" disabled aria-label="Taken by Tato"><span class="av"><span class="face f-tato"></span></span></button>
      <button class="pick" style="min-height: 64px; padding: 6px"><span class="av"><span class="face f-vale"></span></span></button>
      <button class="pick" style="min-height: 64px; padding: 6px" disabled aria-label="Taken by narrator"><span class="av"><span class="face f-nico"></span></span></button>
    </div>
  </div>

  <div style="padding: 14px 16px 6px; display: flex; justify-content: space-between; align-items: center"><span class="h3">In the village</span><span class="sbadge">6 / 10</span></div>
  <div class="lp" style="padding: 0 12px; display: flex; flex-direction: column; gap: 4px">
    <div class="prow" style="grid-template-columns: 36px minmax(0,1fr) auto; background: rgba(244,235,200,.08)"><span class="av av-sm" style="--ring: #F4EBC8"><span class="face f-nico"></span></span><b style="font-size: 15px">Nico <span class="t-small t-muted" style="font-weight: 500">· narrator</span></b><span class="i i-quill" style="color: #F4EBC8" aria-label="Narrator"></span></div>
    <div class="prow" style="grid-template-columns: 36px minmax(0,1fr) auto"><span class="av av-sm"><span class="face f-ana"></span></span><b style="font-size: 15px">Ana</b><span class="sbadge is-ok"><span class="i i-sm i-check"></span>Ready</span></div>
    <div class="prow" style="grid-template-columns: 36px minmax(0,1fr) auto"><span class="av av-sm"><span class="face f-juan"></span></span><b style="font-size: 15px">Juan</b><span class="sbadge is-ok"><span class="i i-sm i-check"></span>Ready</span></div>
    <div class="prow" style="grid-template-columns: 36px minmax(0,1fr) auto"><span class="av av-sm"><span class="face f-marta"></span></span><b style="font-size: 15px">Marta</b><span class="sbadge"><span class="i i-sm i-hourglass"></span>Not yet</span></div>
    <div class="prow" style="grid-template-columns: 36px minmax(0,1fr) auto"><span class="av av-sm"><span class="face f-luis"></span></span><b style="font-size: 15px">Luis</b><span class="sbadge is-ok"><span class="i i-sm i-check"></span>Ready</span></div>
    <div class="prow" style="grid-template-columns: 36px minmax(0,1fr) auto"><span class="av av-sm is-off"><span class="face f-tato"></span></span><b style="font-size: 15px">Tato <span class="t-small t-muted" style="font-weight: 500">· reconnecting</span></b><span class="i i-wifi-off" style="color: var(--warn)"></span></div>
    <div class="prow" style="grid-template-columns: 36px minmax(0,1fr) auto; box-shadow: inset 0 0 0 1.5px var(--accent)"><span class="av av-sm is-you"><span class="face f-caro"></span></span><b style="font-size: 15px">Caro <span class="t-small" style="color: var(--accent)">· you</span></b><span class="sbadge"><span class="i i-sm i-hourglass"></span>Not yet</span></div>
  </div>

  <div style="margin-top: auto; position: relative; height: 134px; flex: none">
    <span class="scene-bg bg-night" style="background-size: cover; background-position: center 70%; opacity: .7"></span>
    <span class="firefly" style="left: 90px; top: 40px"></span><span class="firefly" style="left: 280px; top: 30px; animation-delay: 1.2s"></span>
    <div style="position: absolute; left: 12px; right: 12px; bottom: 12px; display: flex; flex-direction: column; gap: 8px">
      <span class="t-story t-center" style="font-size: 16px; font-style: italic; color: var(--muted)">Waiting for the narrator to start…</span>
      <div class="dock" style="margin: 0; padding: 10px 10px 10px 18px; flex-direction: row; align-items: center; border-radius: 20px">
        <span class="h3" style="flex: 1">I’m ready</span>
        <button class="toggle" role="switch" aria-checked="false" aria-label="I’m ready"></button>
      </div>
    </div>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() { return {}; }
}
</script>
</body>
</html>
