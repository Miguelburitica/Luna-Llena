</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,500..900;1,9..144,500..900&amp;family=IM+Fell+English:ital@0;1&amp;family=Figtree:wght@400;500;600;700;800&amp;display=swap" rel="stylesheet">
<style>body{margin:0}</style>
</helmet>
<div class="phone ph-vote">
  <div class="banner">
    <span class="ph-badge"><span class="i i-split"></span></span>
    <div style="flex: 1"><div class="ph-name">It’s a tie!</div><div class="ph-sub">Day 1 · 3 votes each</div></div>
  </div>
  <div style="display: flex; align-items: center; justify-content: center; gap: 18px; padding: 40px 16px 10px">
    <div style="text-align: center"><span class="av av-xl a-shake" style="--ring: #FFCB5C"><span class="face f-luis" role="img" aria-label="Luis"></span><span class="av-badge" style="min-width: 34px; height: 34px; font-size: 18px">3</span></span><span class="av-name" style="font-size: 16px; margin-top: 12px">Luis</span></div>
    <span class="t-display" style="font-size: 44px; color: var(--accent)">vs</span>
    <div style="text-align: center"><span class="av av-xl a-shake" style="--ring: #FFCB5C; animation-delay: .2s"><span class="face f-tato" role="img" aria-label="Tato"></span><span class="av-badge" style="min-width: 34px; height: 34px; font-size: 18px">3</span></span><span class="av-name" style="font-size: 16px; margin-top: 12px">Tato</span></div>
  </div>
  <div style="padding: 20px 24px 0; text-align: center; display: flex; flex-direction: column; gap: 8px; align-items: center">
    <h1 class="h1" style="font-size: 40px">No execution today</h1>
    <p class="t-body" style="margin: 0; color: var(--muted); max-width: 300px">The village couldn’t agree, so the pitchforks go back in the shed. Luis and Tato live… for now.</p>
  </div>
  <div class="card" style="margin: 26px 12px 0">
    <div class="tally" style="gap: 10px">
      <div class="tally-row"><span class="av av-md"><span class="face f-luis" role="img" aria-label="Luis"></span></span><div class="bar"><i style="width: 43%"></i></div><span class="tally-n">3</span></div>
      <div class="tally-row"><span class="av av-md"><span class="face f-tato" role="img" aria-label="Tato"></span></span><div class="bar"><i style="width: 43%; animation-delay: .12s"></i></div><span class="tally-n">3</span></div>
      <div class="tally-row"><span class="av av-md"><span class="face f-sofi" role="img" aria-label="Sofi"></span></span><div class="bar"><i style="width: 14%; animation-delay: .24s"></i></div><span class="tally-n">1</span></div>
    </div>
  </div>
  <div style="margin-top: auto; padding: 0 12px 12px; display: flex; flex-direction: column; gap: 10px">
    <div class="card" style="display: flex; align-items: center; gap: 12px; padding: 12px 14px"><span class="i i-moon" style="color: var(--accent)"></span><span class="t-small" style="flex: 1">Night falls when Nico is ready.</span><span class="sbadge"><span class="i i-sm i-quill"></span>narrator</span></div>
  </div>
</div>
</x-dc>
