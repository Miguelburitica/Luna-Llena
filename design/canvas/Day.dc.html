<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Day — Discussion</title>
<script src="./support.js"></script>
<link rel="stylesheet" href="./luna-design-system.css">
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Gluten:wght@500..900&amp;family=Gaegu:wght@400;700&amp;family=Sniglet:wght@400;800&amp;family=Rubik+Wet+Paint&amp;display=swap" rel="stylesheet">
<style>body{margin:0}</style>
</helmet>
<div class="phone ph-day">
  <div class="banner">
    <span class="ph-badge"><span class="i i-sun"></span></span>
    <div style="flex: 1"><div class="ph-name">Day</div><div class="ph-sub">Day 2 · Discuss</div></div>
    <button class="btn btn-icon btn-secondary" aria-label="Hold to peek at your role"><span class="i i-card"></span></button>
    <div class="timer"><svg viewBox="0 0 52 52" aria-hidden="true"><circle class="tr-track" cx="26" cy="26" r="22"></circle><circle class="tr-prog" cx="26" cy="26" r="22" stroke-dasharray="138.2" stroke-dashoffset="25"></circle></svg><b>2:30</b></div>
  </div>
  <div class="scene">
    <span class="scene-bg bg-day"></span>
    <div class="hearth" style="background: rgba(255,255,255,.5); color: #C2563E"><span class="i i-lg i-chat"></span></div>
    <div class="seat s1"><span class="av"><span class="face f-ana" role="img" aria-label="Ana"></span></span><span class="av-name">Ana</span></div>
    <div class="seat s2"><span class="av is-dead"><span class="face" role="img" aria-label="Juan, dead"></span></span><span class="av-name">Juan</span></div>
    <div class="seat s3"><span class="av"><span class="face f-marta" role="img" aria-label="Marta, typing"></span><span class="av-badge b-ink" style="font-size: 14px; letter-spacing: 1px">···</span></span><span class="av-name">Marta</span></div>
    <div class="seat s4"><span class="av"><span class="face f-luis" role="img" aria-label="Luis"></span></span><span class="av-name">Luis</span></div>
    <div class="seat s5"><span class="av"><span class="face f-sofi" role="img" aria-label="Sofi"></span></span><span class="av-name">Sofi</span></div>
    <div class="seat s6"><span class="av"><span class="face f-pipe" role="img" aria-label="Pipe"></span></span><span class="av-name">Pipe</span></div>
    <div class="seat s7"><span class="av is-you"><span class="face f-caro" role="img" aria-label="Caro, you"></span><span class="you-tag">You</span></span><span class="av-name" style="margin-top: 11px">Caro</span></div>
    <div class="seat s8"><span class="av"><span class="face f-tato" role="img" aria-label="Tato"></span></span><span class="av-name">Tato</span></div>
  </div>
  <div class="dock" style="gap: 14px">
    <div style="display: flex; align-items: center; gap: 14px">
      <span style="width: 56px; height: 56px; border-radius: 18px; background: #F6E6B4; color: #7A4A10; display: flex; align-items: center; justify-content: center; flex: none"><span class="i i-lg i-users"></span></span>
      <div><div class="h2" style="font-size: 24px">Discuss</div><div class="t-body" style="color: var(--muted)">Vote opens in <b style="color: var(--ink)">2:30</b></div></div>
    </div>
    <div style="padding: 14px; border-radius: 16px; background: rgba(224,145,43,.12); display: flex; gap: 10px; align-items: flex-start">
      <span class="i i-help" style="color: #A35F0A"></span>
      <div><b class="t-small">Who’s acting suspicious?</b><div class="t-small" style="color: var(--muted)">Juan’s last words named Tato. Tato says he was “making arepas”.</div></div>
    </div>
    <div style="display: flex; gap: 8px; flex-wrap: wrap">
      <span class="t-cap" style="color: var(--muted); width: 100%">Quick reactions</span>
      <button class="chip">I trust Ana</button>
      <button class="chip">Sus</button>
      <button class="chip">Not me!</button>
      <button class="chip">Explain, Tato</button>
    </div>
  </div>
  <a href="DayChat.dc.html" class="chatbar" style="text-decoration: none"><span class="av av-sm" style="margin: 0"><span class="face f-tato" role="img" aria-label=""></span></span><span style="flex: 1; min-width: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis"><b>Tato:</b> <span style="font-weight: 500">arepas are a valid alibi</span></span><span class="count">7</span><span class="i i-chevron-up"></span></a>
</div>
</x-dc>

</html>
