<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Night — Wolf</title>
<script src="./support.js"></script>
<link rel="stylesheet" href="./luna-design-system.css">
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Gluten:wght@500..900&amp;family=Gaegu:wght@400;700&amp;family=Sniglet:wght@400;800&amp;family=Rubik+Wet+Paint&amp;display=swap" rel="stylesheet">
<style>body{margin:0}</style>
</helmet>
<div class="phone ph-night">
  <div class="banner">
    <span class="ph-badge"><span class="i i-moon"></span></span>
    <div style="flex: 1"><div class="ph-name">Night</div><div class="ph-sub">Night 2 · The village sleeps</div></div>
    <button class="btn btn-icon btn-secondary" aria-label="Hold to peek at your role"><span class="i i-card"></span></button>
    <div class="timer"><svg viewBox="0 0 52 52" aria-hidden="true"><circle class="tr-track" cx="26" cy="26" r="22"></circle><circle class="tr-prog" cx="26" cy="26" r="22" stroke-dasharray="138.2" stroke-dashoffset="52"></circle></svg><b>0:52</b></div>
  </div>
  <div class="scene">
    <span class="scene-bg bg-night"></span>
    <div class="fog" style="top: 190px"></div>
    <span class="firefly" style="left: 120px; top: 110px"></span><span class="firefly" style="left: 250px; top: 200px; animation-delay: 1.3s"></span>
    <div class="hearth"><span class="i i-lg i-flame"></span></div>
    <div class="seat s1"><span class="av"><span class="face f-ana" role="img" aria-label="Ana"></span></span><span class="av-name">Ana</span></div>
    <div class="seat s2"><span class="av is-target"><span class="face f-juan" role="img" aria-label="Juan, pack target"></span><span class="av-badge b-warn">2</span></span><span class="av-name">Juan</span></div>
    <div class="seat s3"><span class="av"><span class="face f-marta" role="img" aria-label="Marta"></span></span><span class="av-name">Marta</span></div>
    <div class="seat s4"><span class="av is-you"><span class="face f-luis" role="img" aria-label="Luis, you"></span><span class="you-tag">You</span></span><span class="av-name" style="margin-top: 11px">Luis</span></div>
    <div class="seat s5"><span class="av"><span class="face f-sofi" role="img" aria-label="Sofi"></span></span><span class="av-name">Sofi</span></div>
    <div class="seat s6"><span class="av"><span class="face f-pipe" role="img" aria-label="Pipe"></span></span><span class="av-name">Pipe</span></div>
    <div class="seat s7"><span class="av"><span class="face f-caro" role="img" aria-label="Caro"></span></span><span class="av-name">Caro</span></div>
    <div class="seat s8"><span class="av" style="--ring: #FF8F94"><span class="face f-tato" role="img" aria-label="Tato, fellow wolf"></span><span class="av-badge b-left" style="background: #B8323A; color: #fff"><span class="i i-sm i-paw"></span></span></span><span class="av-name">Tato</span></div>
  </div>
  <div class="dock" style="box-shadow: inset 0 0 0 1.5px rgba(255,143,148,.45), var(--shadow-2)">
    <div style="display: flex; align-items: center; gap: 8px"><span class="i i-paw" style="color: #FF8F94"></span><span class="h3" style="flex: 1">Choose tonight’s victim</span><span class="t-small t-muted">with your pack</span></div>
    <div class="picker">
      <button class="pick"><span class="av"><span class="face f-ana" role="img" aria-label=""></span></span>Ana</button>
      <button class="pick is-sel"><span class="av"><span class="face f-juan" role="img" aria-label=""></span></span>Juan<span class="chk"><span class="i i-sm i-check"></span></span><span class="mini"><span class="av av-xs" style="margin: 0; --ring: #FF8F94"><span class="face f-tato" role="img" aria-label="Tato picked Juan"></span></span></span></button>
      <button class="pick"><span class="av"><span class="face f-marta" role="img" aria-label=""></span></span>Marta</button>
      <button class="pick"><span class="av"><span class="face f-sofi" role="img" aria-label=""></span></span>Sofi</button>
      <button class="pick"><span class="av"><span class="face f-pipe" role="img" aria-label=""></span></span>Pipe</button>
      <button class="pick"><span class="av"><span class="face f-caro" role="img" aria-label=""></span></span>Caro</button>
    </div>
    <div style="display: flex; align-items: center; gap: 10px; padding: 10px 12px; border-radius: 14px; background: rgba(95,211,154,.12); color: #8FE6BC; font: 700 13px var(--font-ui)"><span class="i i-sm i-check"></span>Pack agrees on Juan. You can still change until dawn.</div>
  </div>
  <button class="chatbar"><span class="i i-chat"></span><span style="flex: 1; min-width: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis">Wolf chat <span class="t-muted" style="font-weight: 500">· Tato: “him. he’s too smart.”</span></span><span class="count" style="background: #B8323A">2</span><span class="i i-chevron-up"></span></button>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() { return {}; }
}
</script>
</body>
</html>
