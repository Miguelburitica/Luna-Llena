<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Role reveal — Wolf</title>
<script src="./support.js"></script>
<link rel="stylesheet" href="./luna-design-system.css">
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Gluten:wght@500..900&amp;family=Gaegu:wght@400;700&amp;family=Sniglet:wght@400;800&amp;family=Rubik+Wet+Paint&amp;display=swap" rel="stylesheet">
<style>body{margin:0}</style>
</helmet>
<div class="phone ph-night" style="align-items: center; background: radial-gradient(ellipse at 50% 40%, #4A1E3A 0%, #0E1230 70%)">
  <div style="padding: 36px 28px 0; text-align: center; display: flex; flex-direction: column; gap: 6px">
    <span class="t-cap t-muted">The night begins</span>
    <h1 class="h1" style="font-size: 36px">You’re a wolf. Awoo.</h1>
  </div>
  <div style="padding-top: 22px">
    <div class="rcard team-wolf a-flip">
      <span class="rcard-art r-wolf" role="img" aria-label="Werewolf illustration"></span>
      <span class="tbadge"><span class="i i-sm i-paw"></span>Wolves</span>
      <span class="rcard-name">Werewolf</span>
      <span class="rcard-power">Each night, pick a victim with your pack in the wolf chat.</span>
      <span class="rcard-win"><span class="i i-sm i-trophy"></span>Win when wolves equal the village.</span>
    </div>
  </div>
  <div class="card" style="margin: 26px 20px 0; width: 350px; padding: 14px 16px; box-shadow: inset 0 0 0 1.5px rgba(255,143,148,.5)">
    <div style="display: flex; align-items: center; gap: 8px; margin-bottom: 12px"><span class="i i-paw" style="color: #FF8F94"></span><span class="h3">Your pack</span><span class="t-small t-muted" style="margin-left: auto">only wolves see this</span></div>
    <div style="display: flex; gap: 18px">
      <div style="text-align: center"><span class="av av-md is-you"><span class="face f-luis" role="img" aria-label="Luis, you"></span></span><span class="av-name" style="text-shadow: none">Luis (you)</span></div>
      <div style="text-align: center"><span class="av av-md" style="--ring: #FF8F94"><span class="face f-tato" role="img" aria-label="Tato"></span></span><span class="av-name" style="text-shadow: none">Tato</span></div>
      <div style="flex: 1; display: flex; align-items: center"><span class="t-small t-muted">Plot in the <b style="color: #FF8F94">Wolves</b> chat tab. The village can’t read it.</span></div>
    </div>
  </div>
  <div style="margin-top: auto; width: 100%; padding: 0 24px 28px">
    <button class="btn btn-primary btn-lg btn-block">Got it</button>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() { return {}; }
}
</script>
</body>
</html>
