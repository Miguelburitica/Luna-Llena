<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Gluten:wght@500..900&amp;family=Gaegu:wght@400;700&amp;family=Sniglet:wght@400;800&amp;family=Rubik+Wet+Paint&amp;display=swap" rel="stylesheet">
<style>body{margin:0}</style>
</helmet>
<div class="phone ph-night">
  <div style="display: flex; justify-content: space-between; padding: 14px 16px 0">
    <div class="seg" style="width: 108px"><button>ES</button><button class="is-on">EN</button></div>
    <button class="btn btn-icon btn-secondary" aria-label="Settings"><span class="i i-sliders"></span></button>
  </div>
  <div style="display: flex; flex-direction: column; align-items: center; gap: 6px; padding-top: 8px; position: relative; z-index: 2">
    <span class="art f-logo a-wobble" role="img" aria-label="Full moon" style="width: 150px; height: 150px"></span>
    <h1 class="wordmark" style="margin: 0; position: relative; display: inline-flex; flex-direction: column; align-items: center; font: 400 66px/.92 var(--font-logo); letter-spacing: .03em; color: var(--slime); paint-order: stroke fill; -webkit-text-stroke: .16em var(--outline); text-shadow: 0 .09em 0 var(--outline)"><span style="display: block; transform: rotate(-4deg); color: var(--bubblegum)">Luna</span> <span style="display: block; transform: rotate(2deg)">Llena</span><svg viewBox="0 0 200 48" preserveAspectRatio="none" aria-hidden="true" style="position: absolute; left: 8%; bottom: -.42em; width: 84%; height: .6em; overflow: visible; fill: var(--slime); stroke: var(--outline); stroke-width: 3.5px"><path class="wordmark-drip" d="M14 0 C14 13 13 22 18 22 C23 22 22 13 22 0Z"/><path class="wordmark-drip" d="M33 0 C33 20 32 34 38 34 C44 34 43 20 43 0Z" style="animation-delay: .8s"/><path class="wordmark-drip" d="M82 0 C82 17 81 28 86 28 C91 28 90 17 90 0Z" style="animation-delay: .4s"/><path class="wordmark-drip" d="M106 0 C106 24 105 40 112 40 C119 40 118 24 118 0Z" style="animation-delay: 1.2s"/><path class="wordmark-drip" d="M161 0 C161 18 160 30 166 30 C172 30 171 18 171 0Z" style="animation-delay: .6s"/></svg></h1>
    <p class="t-story" style="margin: 22px 0 0; font-size: 18px; color: var(--muted); text-align: center; max-width: 280px">Someone in the village is a wolf. Probably your cousin.</p>
  </div>
  <div style="position: absolute; left: 0; right: 0; bottom: 0; height: 330px">
    <span class="scene-bg bg-night"></span>
    <div class="fog" style="bottom: 70px"></div>
    <span class="firefly" style="left: 60px; top: 120px"></span>
    <span class="firefly" style="left: 300px; top: 90px; animation-delay: 1s"></span>
    <span class="firefly" style="left: 200px; top: 150px; animation-delay: 1.8s"></span>
  </div>
  <div style="margin-top: auto; padding: 0 20px 20px; display: flex; flex-direction: column; gap: 12px; position: relative; z-index: 5">
    <button class="btn btn-primary btn-lg btn-block"><span class="i i-quill"></span>Create a room</button>
    <button class="btn btn-secondary btn-lg btn-block"><span class="i i-link"></span>Join with code</button>
    <a href="HowToPlay.dc.html" class="btn btn-ghost btn-block" style="color: #EEEBFF; text-decoration: underline; text-underline-offset: 4px"><span class="i i-help"></span>How to play · Roles guide</a>
  </div>
</div>
</x-dc>
