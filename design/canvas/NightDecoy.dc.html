<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Night — Done waiting</title>
<script src="./support.js"></script>
<link rel="stylesheet" href="/_blob/d8c3ee55544924b0595ca6734747303d">
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,500..900;1,9..144,500..900&amp;family=IM+Fell+English:ital@0;1&amp;family=Figtree:wght@400;500;600;700;800&amp;display=swap" rel="stylesheet">
<style>body{margin:0}</style>
</helmet>
<div class="phone ph-night">
  <div class="banner">
    <span class="ph-badge"><span class="i i-moon"></span></span>
    <div style="flex: 1"><div class="ph-name">Night</div><div class="ph-sub">Night 2 · The village sleeps</div></div>
    <button class="btn btn-icon btn-secondary" aria-label="Hold to peek at your role"><span class="i i-card"></span></button>
    <div class="timer"><svg viewBox="0 0 52 52" aria-hidden="true"><circle class="tr-track" cx="26" cy="26" r="22"></circle><circle class="tr-prog" cx="26" cy="26" r="22" stroke-dasharray="138.2" stroke-dashoffset="84"></circle></svg><b>0:33</b></div>
  </div>
  <div class="scene">
    <span class="scene-bg bg-night"></span>
    <div class="fog" style="top: 150px"></div><div class="fog" style="top: 230px; animation-duration: 22s"></div>
    <span class="firefly" style="left: 110px; top: 200px"></span><span class="firefly" style="left: 270px; top: 120px; animation-delay: 1s"></span><span class="firefly" style="left: 200px; top: 260px; animation-delay: 2s"></span>
    <div class="hearth"><span class="i i-lg i-flame"></span></div>
    <div class="seat s1"><span class="av is-you"><span class="face f-ana" role="img" aria-label="Ana, you"></span><span class="you-tag">You</span></span><span class="av-name" style="margin-top: 11px">Ana</span></div>
    <div class="seat s2"><span class="av"><span class="face f-juan" role="img" aria-label="Juan"></span></span><span class="av-name">Juan</span></div>
    <div class="seat s3"><span class="av"><span class="face f-marta" role="img" aria-label="Marta"></span></span><span class="av-name">Marta</span></div>
    <div class="seat s4"><span class="av"><span class="face f-luis" role="img" aria-label="Luis"></span></span><span class="av-name">Luis</span></div>
    <div class="seat s5"><span class="av"><span class="face f-sofi" role="img" aria-label="Sofi"></span></span><span class="av-name">Sofi</span></div>
    <div class="seat s6"><span class="av"><span class="face f-pipe" role="img" aria-label="Pipe"></span></span><span class="av-name">Pipe</span></div>
    <div class="seat s7"><span class="av"><span class="face f-caro" role="img" aria-label="Caro"></span></span><span class="av-name">Caro</span></div>
    <div class="seat s8"><span class="av"><span class="face f-tato" role="img" aria-label="Tato"></span></span><span class="av-name">Tato</span></div>
  </div>
  <div class="dock" style="align-items: center; text-align: center; gap: 10px; padding: 22px 18px">
    <span class="a-bob" style="width: 72px; height: 72px; border-radius: 50%; background: rgba(244,235,200,.12); display: flex; align-items: center; justify-content: center; color: #F4EBC8"><span class="i i-xl i-zz"></span></span>
    <h2 class="h2" style="font-size: 26px">Done — the village sleeps…</h2>
    <p class="t-small t-muted" style="margin: 0; max-width: 280px">Night ends when the narrator calls dawn. Keep a straight face on the call.</p>
    <div style="display: flex; align-items: center; gap: 10px; padding: 8px 12px 8px 8px; border-radius: 99px; background: var(--surface-2); margin-top: 4px">
      <span class="av av-sm" style="margin: 0"><span class="face f-tato" role="img" aria-label="Tato"></span></span>
      <span class="t-small">You suspect <b>Tato</b></span>
    </div>
    <button class="btn btn-secondary btn-sm" style="margin-top: 4px"><span class="i i-sm i-edit"></span>Change my pick</button>
  </div>
  <div class="chatbar" style="cursor: default"><span class="i i-lock"></span><span style="flex: 1" class="t-muted">The village sleeps — chat opens at dawn</span></div>
</div>
</x-dc>

</body>
</html>
