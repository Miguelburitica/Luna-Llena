<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Night — Doctor</title>
<script src="./support.js"></script>
<link rel="stylesheet" href="/_blob/d8c3ee55544924b0595ca6734747303d">
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,500..900;1,9..144,500..900&amp;family=IM+Fell+English:ital@0;1&amp;family=Figtree:wght@400;500;600;700;800&amp;display=swap" rel="stylesheet">
<style>body{margin:0}</style>
</helmet>
<div class="phone ph-night">
  <div class="banner">
    <span class="ph-badge"><span class="i i-moon"></span></span>
    <div style="flex: 1"><div class="ph-name">Night</div><div class="ph-sub">Night 2 · The village sleeps</div></div>
    <button class="btn btn-icon btn-secondary" aria-label="Hold to peek at your role"><span class="i i-card"></span></button>
    <div class="timer"><svg viewBox="0 0 52 52" aria-hidden="true"><circle class="tr-track" cx="26" cy="26" r="22"></circle><circle class="tr-prog" cx="26" cy="26" r="22" stroke-dasharray="138.2" stroke-dashoffset="60"></circle></svg><b>0:47</b></div>
  </div>
  <div class="scene" style="height: 300px">
    <span class="scene-bg bg-night"></span>
    <div class="fog" style="top: 180px"></div>
    <div class="hearth" style="top: 112px"><span class="i i-lg i-shield"></span></div>
    <div class="seat s1" style="top: 14px"><span class="av"><span class="face f-ana" role="img" aria-label="Ana"></span></span><span class="av-name">Ana</span></div>
    <div class="seat s2" style="top: 44px"><span class="av is-you"><span class="face f-juan" role="img" aria-label="Juan, you"></span><span class="you-tag">You</span></span><span class="av-name" style="margin-top: 11px">Juan</span></div>
    <div class="seat s3" style="top: 122px"><span class="av"><span class="face f-marta" role="img" aria-label="Marta"></span></span><span class="av-name">Marta</span></div>
    <div class="seat s4" style="top: 196px"><span class="av"><span class="face f-luis" role="img" aria-label="Luis"></span></span><span class="av-name">Luis</span></div>
    <div class="seat s5" style="top: 222px"><span class="av"><span class="face f-sofi" role="img" aria-label="Sofi"></span></span><span class="av-name">Sofi</span></div>
    <div class="seat s6" style="top: 196px"><span class="av is-sel"><span class="face f-pipe" role="img" aria-label="Pipe, protected"></span><span class="av-badge b-ink"><span class="i i-sm i-shield"></span></span></span><span class="av-name">Pipe</span></div>
    <div class="seat s7" style="top: 122px"><span class="av"><span class="face f-caro" role="img" aria-label="Caro"></span></span><span class="av-name">Caro</span></div>
    <div class="seat s8" style="top: 44px"><span class="av"><span class="face f-tato" role="img" aria-label="Tato"></span></span><span class="av-name">Tato</span></div>
  </div>
  <div class="dock" style="position: relative">
    <div style="display: flex; align-items: center; gap: 8px"><span class="i i-shield" style="color: var(--accent)"></span><span class="h3" style="flex: 1">Who do you protect tonight?</span></div>
    <div class="picker">
      <button class="pick" disabled aria-describedby="why-ana"><span class="av"><span class="face f-ana" role="img" aria-label=""></span></span>Ana<span class="why">last night</span></button>
      <button class="pick"><span class="av"><span class="face f-juan" role="img" aria-label=""></span></span>You</button>
      <button class="pick"><span class="av"><span class="face f-marta" role="img" aria-label=""></span></span>Marta</button>
      <button class="pick"><span class="av"><span class="face f-luis" role="img" aria-label=""></span></span>Luis</button>
      <button class="pick"><span class="av"><span class="face f-sofi" role="img" aria-label=""></span></span>Sofi</button>
      <button class="pick is-sel"><span class="av"><span class="face f-pipe" role="img" aria-label=""></span></span>Pipe<span class="chk"><span class="i i-sm i-check"></span></span></button>
      <button class="pick"><span class="av"><span class="face f-caro" role="img" aria-label=""></span></span>Caro</button>
      <button class="pick"><span class="av"><span class="face f-tato" role="img" aria-label=""></span></span>Tato</button>
    </div>
    <div id="why-ana" role="tooltip" style="position: absolute; left: 12px; top: 54px; transform: translateY(-100%); width: 220px; padding: 10px 12px; border-radius: 12px; background: #F4E9D0; color: #3B2A1A; font: 600 12px/1.35 var(--font-ui); box-shadow: var(--shadow-2); z-index: 5">You protected Ana last night. The Doctor can’t pick the same player twice in a row.<i style="position: absolute; left: 34px; bottom: -6px; width: 12px; height: 12px; background: #F4E9D0; transform: rotate(45deg)"></i></div>
    <div style="display: flex; align-items: center; gap: 10px; padding: 10px 12px; border-radius: 14px; background: rgba(95,211,154,.12); color: #8FE6BC; font: 700 13px var(--font-ui)"><span class="i i-sm i-shield-check"></span>Pipe is protected. Change anytime until dawn.</div>
  </div>
  <div class="chatbar" style="cursor: default"><span class="i i-lock"></span><span style="flex: 1" class="t-muted">The village sleeps — chat opens at dawn</span></div>
</div>
</x-dc>

  renderVals() { return {}; }

</body>
</html>
